services:
  benchmark-debug:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    ports:
      - "5678:5678"  # debugpy port
    environment:
      - PYTHONPATH=/app
      - PYTHON_DEBUG=1
      # Reach the mlflow tracking server by its service name, overriding .env
      - MLFLOW_HOST=mlflow
    env_file:
      - .env
    volumes:
      - ./divevision:/app/divevision
    depends_on:
      - mlflow
    networks:
      - backend-network
    command: python -m debugpy --listen 0.0.0.0:5678 --wait-for-client /app/divevision/src/test.py
    stdin_open: true
    tty: true

networks:
  backend-network: