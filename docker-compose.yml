services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./divevision:/app/divevision
    restart: unless-stopped
    networks:
      - frontend-network

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    command:
      - /bin/bash ./mlflow_server.sh
    ports:
      - "${MLFLOW_PORT}:5000"
    environment:
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ./divevision:/app/divevision
      - ./mlflow_server.sh:/mlflow_server.sh
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{$MLFLOW_PORT}/version"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    environment:
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ./divevision:/app/divevision
    depends_on:
      - mlflow
    profiles:
      - benchmark
    networks:
      - backend-network

  postgres:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "${SUPABASE_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
    internal: false # Allows for communication with other services
  frontend-network:
    driver: bridge

volumes:
  postgres_data: